<!-- LAYR - Minimal App Icon: Overlapping Circles -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="font-family:system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F1A"/>
      <stop offset="100%" style="stop-color:#111122"/>
    </linearGradient>
    <linearGradient id="c1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="c2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#DB2777"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad)"/>

  <!-- Two overlapping circles, centered -->
  <circle cx="210" cy="256" r="120" fill="url(#c1)" opacity="0.65"/>
  <circle cx="302" cy="256" r="120" fill="url(#c2)" opacity="0.65"/>
</svg>
